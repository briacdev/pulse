name: Release Agent Jar

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build agent jar
        run: ./mvnw --batch-mode clean test package

      - name: Prepare release assets
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_JAR="$(find target -maxdepth 1 -type f -name 'pulse-*-agent.jar' | head -n 1)"

          if [ -z "${SOURCE_JAR}" ]; then
            echo "Agent jar not found in target/"
            exit 1
          fi

          mkdir -p dist
          RELEASE_JAR="dist/pulse-${VERSION}-agent.jar"
          cp "${SOURCE_JAR}" "${RELEASE_JAR}"
          sha256sum "${RELEASE_JAR}" > "${RELEASE_JAR}.sha256"
          echo "release_jar=${RELEASE_JAR}" >> "${GITHUB_OUTPUT}"
          echo "release_checksum=${RELEASE_JAR}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.prepare.outputs.release_jar }}
            ${{ steps.prepare.outputs.release_checksum }}
